<div class="container px-4 py-5" id="featured-3">
    <h2 class="pb-2 border-bottom">Columns with icons</h2>
    <div class="row g-4 py-5 row-cols-1 row-cols-lg-3">
      <div class="feature col" *ngFor="let prodItems of products">
        <div class="feature-icon d-inline-flex align-items-center justify-content-center text-bg-primary bg-gradient fs-2 mb-3">
          <img [src]="prodItems.productImage" class="imageFix">
        </div>
        <h3 class="fs-2 text-body-emphasis">{{prodItems.productName}}</h3>
        <p>{{prodItems.productDescription}}</p>
        <div class="p-2">
          <p><span class="badge text-bg-info p-2 m-1">{{prodItems.productMaterial}}</span><span class="badge text-bg-info p-2">{{prodItems.productAdjective}}</span></p>
        </div>
        <a href="#" class="icon-link">
          Call to action
          <svg class="bi"><use xlink:href="#chevron-right"></use></svg>
        </a>
      </div>
    </div>
  </div>
